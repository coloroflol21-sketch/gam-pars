name: Playgama Farmer

on:
  workflow_dispatch: 

jobs:
  farm:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        game_url: ["https://playgama.ai/play/e5taob35jvvphv"]
      fail-fast: false 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install playwright --upgrade
          playwright install --with-deps chromium

      - name: Run bot with Xvfb
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" python bot.py ${{ matrix.game_url }}

      - name: Upload Screenshots
        # Сработает в любом случае (успех или ошибка)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: screenshot_*.png
          retention-days: 1
