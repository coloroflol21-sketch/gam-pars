name: Playgama Farmer

on:
  workflow_dispatch: # Ручной запуск
  # schedule:
  #   - cron: '0 */4 * * *' # Автозапуск каждые 4 часа (если раскомментировать)

jobs:
  farm:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # СЮДА ВСТАВЬ ССЫЛКИ НА ТВОИ 4 ИГРЫ
        game_url: [
          "https://playgama.com/game/kick-lucky-block", # Пример
          "https://playgama.com/game/steal-the-egg",    # Пример
          "https://playgama.com/game/cosmic-cleaners",  # Пример
          "https://playgama.com/game/твоя-4-игра"       # Пример
        ]
      fail-fast: false # Если одна упадет, остальные продолжат
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps

      - name: Run bot with Xvfb
        # Передаем URL из матрицы в скрипт
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" python bot.py ${{ matrix.game_url }}
