name: Playgama Farmer

on:
  workflow_dispatch: 

jobs:
  farm:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        game_url: [
          "https://playgama.ai/play/3wn224fqza4lik",
          "https://playgama.ai/play/qz4275umslq3zk",
          "https://playgama.ai/play/dvyclrh6fqzwdd",
          "https://playgama.ai/play/e5taob35jvvphv"
        ]
      fail-fast: false 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps

      - name: Run bot with Xvfb
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" python bot.py ${{ matrix.game_url }}

      # Этот шаг сработает, только если скрипт упал с ошибкой
      - name: Upload Error Screenshots
        if: failure() 
        uses: actions/upload-artifact@v4
        with:
          name: error-screenshots-${{ strategy.job-index }}
          path: ./*.png
          retention-days: 1
